<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lounge Rating</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin: 20px 0;
        }
        p {
            font-size: 18px;
        }
        .error {
            color: red;
        }
        .success {
            color: lightgreen;
        }
        #results {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Lounge Rating</h1>
    <p id="status">Fetching data...</p>
    <div id="player-data"></div>

    <script>
        async function fetchAndParsePlayerData() {
            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('player_id');

            if (!playerId) {
                document.getElementById('status').textContent = "Please specify a player_id in the URL, e.g., ?player_id=5402";
                return;
            }

            const proxyUrl = "https://api.allorigins.win/get?url="; // CORS proxy
            const targetUrl = `https://mkwlounge.gg/ladder/player.php?ladder_id=15&player_id=${playerId}`;
            const url = proxyUrl + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(url);
                const data = await response.json();
                const htmlText = data.contents; // Extract the HTML response

                // Parse the HTML response
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");

                // Example: Extract player stats from a specific table
                const playerTable = doc.querySelector("table.profiletable");
                if (playerTable) {
                    document.getElementById('status').textContent = "Data fetched successfully!";
                    document.getElementById('status').className = "success";

                    // Display the table
                    document.getElementById('player-data').innerHTML = playerTable.outerHTML;
                } else {
                    document.getElementById('status').textContent = "Error: Could not find player data.";
                    document.getElementById('status').className = "error";
                }
            } catch (error) {
                console.error("Error fetching or parsing player data:", error);
                document.getElementById('status').textContent = "Error fetching data. See console for details.";
                document.getElementById('status').className = "error";
            }
        }

        window.onload = fetchAndParsePlayerData;
    </script>
</body>
</html>
