<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player ID Search</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #output {
            margin: 20px;
            font-size: 18px;
            color: black;
        }
    </style>
</head>
<body>
    <div id="output">Loading...</div>

    <script>
        async function fetchAndSearchCSV() {
            // Get the player name from the URL query string
            const params = new URLSearchParams(window.location.search);
            const playerName = params.get('playername');

            // If no player name is provided, display an error
            if (!playerName) {
                document.getElementById('output').innerText = "Error: No player name provided in the URL.";
                return;
            }

            const proxyUrl = "https://api.allorigins.win/get?url=";
            const csvUrl = "https://mkwlounge.gg/csv/leaderboard_ladder_id_15.csv";
            const fullUrl = proxyUrl + encodeURIComponent(csvUrl);

            try {
                // Fetch the CSV file through the proxy
                const response = await fetch(fullUrl);
                if (!response.ok) throw new Error("Failed to fetch CSV file.");
                const data = await response.json();
                const csvText = data.contents; // Extract the CSV content from the proxy response

                // Parse the CSV file
                const rows = csvText.split('\n').map(row => row.split(','));

                // Search for the player name and get the corresponding player ID
                const headers = rows[0]; // First row contains headers
                const playerIndex = headers.findIndex(header => header.replace(/"/g, '').toLowerCase() === "player_name");
                const idIndex = headers.findIndex(header => header.replace(/"/g, '').toLowerCase() === "player_id");

                if (playerIndex === -1 || idIndex === -1) {
                    throw new Error("CSV headers missing 'player_name' or 'player_id'.");
                }

                const matchingRow = rows.find(row => row[playerIndex]?.replace(/"/g, '').toLowerCase() === playerName.toLowerCase());

                // Display the result
                if (matchingRow) {
                    const playerId = matchingRow[idIndex];
                    document.getElementById('output').innerText = `Player ID for "${playerName}" is ${playerId}.`;
                } else {
                    document.getElementById('output').innerText = `Player "${playerName}" not found in the CSV.`;
                }
            } catch (error) {
                console.error("Error processing CSV:", error);
                document.getElementById('output').innerText = "Error fetching or processing the CSV file.";
            }
        }

        // Call the function to fetch and search the CSV
        fetchAndSearchCSV();
    </script>
</body>
</html>
