<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lounge Rating</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Transparent background */
            font-family: Arial, sans-serif;
        }
        #player-stats {
            position: absolute;
            top: 10px; /* Position at the top-left corner */
            left: 10px;
            color: black; /* Black text */
            font-size: 18px;
        }
        sup {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="player-stats">Loading...</div> <!-- Only LR and MMR will be displayed here -->

    <script>
        async function fetchAndUpdatePlayerStats() {
            const params = new URLSearchParams(window.location.search);
            let playerId = params.get('id');
            const playerName = params.get('name');

            // If no 'id' or 'name' is provided, display an error
            if (!playerId && !playerName) {
                document.getElementById('player-stats').innerHTML = "Error: Provide 'id' or 'name' in the URL.";
                return;
            }

            try {
                // If 'name' is provided, fetch the CSV to resolve 'id'
                if (playerName && !playerId) {
                    const proxyUrl = "https://api.allorigins.win/get?url=";
                    const csvUrl = "https://mkwlounge.gg/csv/leaderboard_ladder_id_15.csv";
                    const fullUrl = proxyUrl + encodeURIComponent(csvUrl);

                    const response = await fetch(fullUrl);
                    if (!response.ok) throw new Error("Failed to fetch CSV file.");
                    const data = await response.json();
                    const csvText = data.contents; // Extract CSV content from proxy response

                    // Parse the CSV file
                    const rows = csvText.split('\n').map(row => row.split(','));
                    const headers = rows[0]; // First row contains headers
                    const playerIndex = headers.findIndex(header => header.replace(/"/g, '').toLowerCase() === "player_name");
                    const idIndex = headers.findIndex(header => header.replace(/"/g, '').toLowerCase() === "player_id");

                    if (playerIndex === -1 || idIndex === -1) {
                        throw new Error("CSV headers missing 'player_name' or 'player_id'.");
                    }

                    const matchingRow = rows.find(row => row[playerIndex]?.replace(/"/g, '').toLowerCase() === playerName.toLowerCase());
                    if (matchingRow) {
                        playerId = matchingRow[idIndex];
                    } else {
                        throw new Error(`Player "${playerName}" not found in the CSV.`);
                    }
                }

                // Fetch player data using the resolved or provided 'id'
                if (playerId) {
                    const proxyUrl = "https://api.allorigins.win/get?url="; // CORS proxy
                    const targetUrl = `https://mkwlounge.gg/ladder/player.php?ladder_id=15&player_id=${playerId}`;
                    const url = proxyUrl + encodeURIComponent(targetUrl);

                    const response = await fetch(url);
                    const data = await response.json();
                    const htmlText = data.contents;

                    // Parse the HTML response
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, "text/html");

                    // Target the first row of the table
                    const firstRow = doc.querySelector(".profiletable tr.thick"); // First row with class 'thick'

                    if (firstRow) {
                        const cells = firstRow.querySelectorAll("td");

                        // Extract data based on column positions
                        const mmrChange = cells[8]?.textContent.trim();
                        const mmr = cells[9]?.textContent.trim();
                        const lrChange = cells[10]?.textContent.trim();
                        const lr = cells[11]?.textContent.trim();

                        if (mmr && lr && mmrChange && lrChange) {
                            // Format the data
                            const formattedStats = `LR: ${lr}<sup>${lrChange}</sup>   MMR: ${mmr}<sup>${mmrChange}</sup>`;
                            document.getElementById('player-stats').innerHTML = formattedStats;
                        } else {
                            document.getElementById('player-stats').innerHTML = "Error: Could not find player stats.";
                        }
                    } else {
                        document.getElementById('player-stats').innerHTML = "Error: Could not find the profile table row.";
                    }
                }
            } catch (error) {
                console.error("Error:", error);
                document.getElementById('player-stats').innerHTML = error.message;
            }
        }

        // Fetch data and update periodically (every 30 seconds)
        fetchAndUpdatePlayerStats(); // Initial fetch
        setInterval(fetchAndUpdatePlayerStats, 30000); // Update every 30 seconds
    </script>
</body>
</html>
