<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lounge Rating</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin: 20px 0;
        }
        p {
            font-size: 18px;
        }
        .error {
            color: red;
        }
        .success {
            color: lightgreen;
        }
        #player-stats {
            margin-top: 20px;
            font-size: 24px;
        }
        sup {
            font-size: 16px;
        }
    </style>
</head>
<body>
    <h1>Lounge Rating</h1>
    <p id="status">Fetching data...</p>
    <div id="player-stats"></div>

    <script>
        async function fetchAndDisplayPlayerStats() {
            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('player_id');

            if (!playerId) {
                document.getElementById('status').textContent = "Please specify a player_id in the URL, e.g., ?player_id=5402";
                return;
            }

            const proxyUrl = "https://api.allorigins.win/get?url="; // CORS proxy
            const targetUrl = `https://mkwlounge.gg/ladder/player.php?ladder_id=15&player_id=${playerId}`;
            const url = proxyUrl + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(url);
                const data = await response.json();
                const htmlText = data.contents; // Extract the HTML response

                // Parse the HTML response
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");

                // Update these selectors to match the structure in example.mhtml
                const lrElement = doc.querySelector(".profiletable tr:nth-child(2) td:nth-child(2)"); // Adjust based on actual structure
                const mmrElement = doc.querySelector(".profiletable tr:nth-child(3) td:nth-child(2)"); // Adjust based on actual structure

                if (lrElement && mmrElement) {
                    const lrText = lrElement.textContent.trim(); // Example: "2987+181"
                    const mmrText = mmrElement.textContent.trim(); // Example: "3035+240"

                    // Split into main value and change
                    const [lr, lrChange] = lrText.split(/(?=[+-])/); // Matches values like "2987+181"
                    const [mmr, mmrChange] = mmrText.split(/(?=[+-])/); // Matches values like "3035+240"

                    // Format and display the data
                    document.getElementById('status').textContent = "Data fetched successfully!";
                    document.getElementById('status').className = "success";

                    const formattedStats = `LR: ${lr}<sup>${lrChange}</sup>   MMR: ${mmr}<sup>${mmrChange}</sup>`;
                    document.getElementById('player-stats').innerHTML = formattedStats;
                } else {
                    document.getElementById('status').textContent = "Error: Could not find player stats.";
                    document.getElementById('status').className = "error";
                }
            } catch (error) {
                console.error("Error fetching or parsing player data:", error);
                document.getElementById('status').textContent = "Error fetching data. See console for details.";
                document.getElementById('status').className = "error";
            }
        }

        window.onload = fetchAndDisplayPlayerStats;
    </script>
</body>
</html>
