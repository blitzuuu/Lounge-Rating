<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lounge Rating</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            margin: 0;
            padding: 0;
        }
        .header {
            position: absolute;
            top: 10px;
            left: 10px;
            font-size: 18px;
            font-weight: bold;
        }
        .error {
            color: red;
        }
        .success {
            color: lightgreen;
        }
    </style>
</head>
<body>
    <div class="header" id="header">Loading...</div>

    <script>
        async function fetchAndDisplayData() {
            const params = new URLSearchParams(window.location.search);
            let playerId = params.get('id');
            const playerName = params.get('name');

            if (!playerId && !playerName) {
                document.getElementById('header').textContent = "Error: Please provide 'id' or 'name' in the URL.";
                document.getElementById('header').className = "error";
                return;
            }

            try {
                // Fetch player_id if name is provided
                if (!playerId && playerName) {
                    const proxyUrl = "https://api.allorigins.win/get?url=";
                    const csvUrl = "https://mkwlounge.gg/csv/leaderboard_ladder_id_15.csv";
                    const fullUrl = proxyUrl + encodeURIComponent(csvUrl);

                    const response = await fetch(fullUrl);
                    if (!response.ok) throw new Error("Failed to fetch CSV.");
                    const data = await response.json();
                    const base64Content = data.contents.split(',')[1];
                    const csvText = atob(base64Content);

                    // Parse CSV
                    const rows = csvText.split('\n').map(row => row.split(','));
                    const headers = rows[0];
                    const playerIndex = headers.findIndex(h => h.replace(/"/g, '').toLowerCase() === "player_name");
                    const idIndex = headers.findIndex(h => h.replace(/"/g, '').toLowerCase() === "player_id");

                    if (playerIndex === -1 || idIndex === -1) {
                        throw new Error("CSV headers missing 'player_name' or 'player_id'.");
                    }

                    const matchingRow = rows.find(row => row[playerIndex]?.replace(/"/g, '').toLowerCase() === playerName.toLowerCase());
                    if (matchingRow) {
                        playerId = matchingRow[idIndex];
                    } else {
                        throw new Error(`Player "${playerName}" not found.`);
                    }
                }

                // Fetch player data using id
                if (playerId) {
                    const proxyUrl = "https://api.allorigins.win/get?url=";
                    const playerUrl = `https://mkwlounge.gg/ladder/player.php?ladder_id=15&player_id=${playerId}`;
                    const fullUrl = proxyUrl + encodeURIComponent(playerUrl);

                    const response = await fetch(fullUrl);
                    const data = await response.json();
                    const htmlText = data.contents;

                    // Parse HTML
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlText, "text/html");

                    // Extract Lounge Rating (LR) and MMR Gain/Loss
                    const lrElement = doc.querySelector("td.rating");
                    const mmrElement = doc.querySelector("td.mmr-change");

                    const loungeRating = lrElement ? lrElement.textContent.trim() : "N/A";
                    const mmrChange = mmrElement ? mmrElement.textContent.trim() : "N/A";

                    document.getElementById('header').textContent = `LR: ${loungeRating} | MMR: ${mmrChange}`;
                    document.getElementById('header').className = "success";
                }
            } catch (error) {
                console.error(error);
                document.getElementById('header').textContent = error.message;
                document.getElementById('header').className = "error";
            }
        }

        window.onload = fetchAndDisplayData;
    </script>
</body>
</html>
