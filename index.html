<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lounge Rating</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent;
            font-family: 'Roboto Mono', monospace;
        }
        #player-stats {
            position: absolute;
            top: 10px;
            left: 10px;
            color: black;
            font-size: 30px; /* Base font size */
            font-weight: 500;
        }
        sup {
            font-size: 0.75em; /* 3/4ths of the parent font size */
        }
        .gain {
            color: mediumseagreen;
        }
        .loss {
            color: tomato;
        }
        .cached {
            opacity: 0.8;
            font-size: 0.7em;
            display: block;
            margin-top: 4px;
        }
    </style>
</head>
<body>
    <div id="player-stats">Loading...</div>

    <script>
        // Key used in localStorage to persist the last successful stats
        const STORAGE_KEY = 'lounge_rating_last_stats';

        async function fetchAndUpdatePlayerStats() {
            // Get parameters from the URL
            const params = new URLSearchParams(window.location.search);
            let playerId = params.get('id');
            const playerName = params.get('name');
            const isCT = params.has('ct'); // Check if 'ct' is present in the URL

            // Set ladder_id based on whether 'ct' is in the URL
            const ladderId = isCT ? 18 : 17;

            // If no id but name is provided, fetch the player_id from player_data.json
            if (!playerId && playerName) {
                try {
                    const response = await fetch("player_data.json");
                    if (!response.ok) throw new Error("Failed to fetch player_data.json");
                    const players = await response.json();

                    // Search for the player by name
                    const player = players.find(p => p.name.toLowerCase() === playerName.toLowerCase());
                    if (player) {
                        playerId = player.id;
                    } else {
                        throw new Error(`Player "${playerName}" not found.`);
                    }
                } catch (error) {
                    console.error("Error fetching or parsing player_data.json:", error);
                    document.getElementById('player-stats').innerHTML = "Error fetching player information.";
                    return;
                }
            }

            // If no player_id is available after all, display an error
            if (!playerId) {
                document.getElementById('player-stats').innerHTML = "Error: No id or valid name provided.";
                return;
            }

            // Fetch player data using player_id and ladder_id
            const proxyUrl = "https://api.allorigins.win/get?url=";
            const targetUrl = `https://mkwlounge.gg/ladder/player.php?ladder_id=${ladderId}&player_id=${playerId}`;
            const url = proxyUrl + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error("Network response was not ok");
                const data = await response.json();
                const htmlText = data.contents;

                // Parse the HTML response
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");

                // Target the first row of the table
                const firstRow = doc.querySelector(".profiletable tr.thick");

                if (firstRow) {
                    const cells = firstRow.querySelectorAll("td");

                    // Extract data based on column positions
                    const mmrChange = cells[8]?.textContent.trim();
                    const mmr = cells[9]?.textContent.trim();
                    const lrChange = cells[10]?.textContent.trim();
                    const lr = cells[11]?.textContent.trim();

                    if (mmr && lr && mmrChange && lrChange) {
                        // Determine colors for gain/loss
                        const mmrChangeColor = parseFloat(mmrChange) >= 0 ? "gain" : "loss";
                        const lrChangeColor = parseFloat(lrChange) >= 0 ? "gain" : "loss";

                        // Format the data with colors and relative font size
                        const formattedStats = `
                            LR: ${lr}<sup class="${lrChangeColor}">${lrChange}</sup>
                            MMR: ${mmr}<sup class="${mmrChangeColor}">${mmrChange}</sup>
                        `;
                        document.getElementById('player-stats').innerHTML = formattedStats;

                        // Persist the last successful stats to localStorage
                        try {
                            const payload = {
                                lr, mmr, lrChange, mmrChange,
                                timestamp: Date.now(),
                                ladderId,
                                playerId
                            };
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(payload));
                        } catch (e) {
                            console.warn("Unable to save to localStorage:", e);
                        }
                    } else {
                        // If parsing didn't yield expected values, fall back to cached display
                        displayCachedOrError("Error: Could not find player stats.");
                    }
                } else {
                    displayCachedOrError("Error: Could not find the profile table row.");
                }
            } catch (error) {
                console.error("Error fetching or parsing player data:", error);
                // On fetch error, try to display last cached stats
                displayCachedOrError("Error fetching data.");
            }
        }

        // Try to read cached stats from localStorage and display them; if none, show the provided error message
        function displayCachedOrError(errorMessage) {
            try {
                const raw = localStorage.getItem(STORAGE_KEY);
                if (raw) {
                    const cached = JSON.parse(raw);
                    // Optionally ensure cached entry corresponds to same player/ladder — this example shows it regardless.
                    const lrChangeColor = parseFloat(cached.lrChange) >= 0 ? "gain" : "loss";
                    const mmrChangeColor = parseFloat(cached.mmrChange) >= 0 ? "gain" : "loss";

                    const ageSeconds = Math.floor((Date.now() - (cached.timestamp || 0)) / 1000);
                    const ageText = ageSeconds >= 0 ? `Cached ${ageSeconds}s ago` : '';

                    const formattedStats = `
                        LR: ${cached.lr}<sup class="${lrChangeColor}">${cached.lrChange}</sup>
                        MMR: ${cached.mmr}<sup class="${mmrChangeColor}">${cached.mmrChange}</sup>
                        <span class="cached">${ageText} — showing last known values</span>
                    `;
                    document.getElementById('player-stats').innerHTML = formattedStats;
                } else {
                    document.getElementById('player-stats').innerHTML = errorMessage;
                }
            } catch (e) {
                console.error("Error reading cached stats:", e);
                document.getElementById('player-stats').innerHTML = errorMessage;
            }
        }

        // Monitor changes to query parameters and update player stats dynamically
        let currentSearch = window.location.search;

        function monitorQueryParams() {
            const newSearch = window.location.search;
            if (newSearch !== currentSearch) {
                currentSearch = newSearch;
                fetchAndUpdatePlayerStats();
            }
        }

        // Call this every second to check for query parameter changes
        setInterval(monitorQueryParams, 1000);

        // Fetch data and update periodically (every 30 seconds)
        fetchAndUpdatePlayerStats();
        setInterval(fetchAndUpdatePlayerStats, 30000);
    </script>
</body>
</html>
