<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lounge Rating</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: transparent; /* Transparent background */
            font-family: Arial, sans-serif;
        }
        #player-stats {
            position: absolute;
            top: 10px; /* Position at the top-left corner */
            left: 10px;
            color: black; /* Black text */
            font-size: 18px;
        }
        sup {
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div id="player-stats">Loading...</div> <!-- Only LR and MMR will be displayed here -->

    <script>
        async function fetchAndUpdatePlayerStats() {
            // Get the 'player_id' from the URL query string
            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('player_id');

            // If no player_id is provided, display an error
            if (!playerId) {
                document.getElementById('player-stats').innerHTML = "Error: No player_id provided.";
                return;
            }

            const proxyUrl = "https://api.allorigins.win/get?url="; // CORS proxy
            const targetUrl = `https://mkwlounge.gg/ladder/player.php?ladder_id=15&player_id=${playerId}`;
            const url = proxyUrl + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(url);
                const data = await response.json();
                const htmlText = data.contents;

                // Parse the HTML response
                const parser = new DOMParser();
                const doc = parser.parseFromString(htmlText, "text/html");

                // Target the first row of the table
                const firstRow = doc.querySelector(".profiletable tr.thick"); // First row with class 'thick'

                if (firstRow) {
                    const cells = firstRow.querySelectorAll("td");

                    // Extract data based on column positions
                    const mmrChange = cells[8]?.textContent.trim();
                    const mmr = cells[9]?.textContent.trim();
                    const lrChange = cells[10]?.textContent.trim();
                    const lr = cells[11]?.textContent.trim();

                    if (mmr && lr && mmrChange && lrChange) {
                        // Format the data
                        const formattedStats = `LR: ${lr}<sup>${lrChange}</sup>   MMR: ${mmr}<sup>${mmrChange}</sup>`;
                        document.getElementById('player-stats').innerHTML = formattedStats;
                    } else {
                        document.getElementById('player-stats').innerHTML = "Error: Could not find player stats.";
                    }
                } else {
                    document.getElementById('player-stats').innerHTML = "Error: Could not find the profile table row.";
                }
            } catch (error) {
                console.error("Error fetching or parsing player data:", error);
                document.getElementById('player-stats').innerHTML = "Error fetching data.";
            }
        }

        // Fetch data and update periodically (every 30 seconds)
        fetchAndUpdatePlayerStats(); // Initial fetch
        setInterval(fetchAndUpdatePlayerStats, 30000); // Update every 30 seconds
    </script>
</body>
</html>
