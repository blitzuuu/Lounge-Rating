<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lounge Rating</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        h1 {
            margin: 20px 0;
        }
        p {
            font-size: 18px;
        }
        .error {
            color: red;
        }
        .success {
            color: lightgreen;
        }
        #results {
            margin-top: 20px;
            white-space: pre-wrap;
            text-align: left;
        }
    </style>
</head>
<body>
    <h1>Lounge Rating</h1>
    <p id="status">Fetching data...</p>
    <div id="results"></div>

    <script>
        async function fetchPlayerData() {
            const params = new URLSearchParams(window.location.search);
            const playerId = params.get('player_id');

            if (!playerId) {
                document.getElementById('status').textContent = "Please specify a player_id in the URL, e.g., ?player_id=5402";
                return;
            }

            const ladderId = 15; // Fixed ladder ID
            const proxyUrl = "https://corsproxy.io/?"; // CORS proxy URL
            const targetUrl = `https://mkwlounge.gg/ladder/player.php?ladder_id=${ladderId}&player_id=${playerId}`;
            const url = proxyUrl + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(url, {
                    headers: {
                        "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/110.0.0.0 Safari/537.36"
                    }
                });

                if (response.ok) {
                    const htmlText = await response.text();
                    document.getElementById('status').textContent = "Data fetched successfully!";
                    document.getElementById('status').className = "success";

                    // Display the raw HTML response for debugging purposes
                    document.getElementById('results').textContent = htmlText;
                } else {
                    document.getElementById('status').textContent = "Failed to fetch data. Status: " + response.status;
                    document.getElementById('status').className = "error";
                }
            } catch (error) {
                console.error("Error fetching player data:", error);
                document.getElementById('status').textContent = "Error fetching data. See console for details.";
                document.getElementById('status').className = "error";
            }
        }

        window.onload = fetchPlayerData;
    </script>
</body>
</html>
