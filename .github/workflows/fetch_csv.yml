name: Fetch CSV and Generate JSON

on:
  workflow_dispatch:

jobs:
  fetch-csv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install beautifulsoup4 requests

      - name: Run script to fetch CSV and generate JSON
        run: |
          python3 <<EOF
          import requests
          from bs4 import BeautifulSoup
          import csv
          import json
          import os

          CSV_PAGE_URL = "https://mkwlounge.gg/csv/leaderboard_ladder_id_15.csv"
          OUTPUT_JSON_FILE = "player_data.json"

          def fetch_and_process_csv():
              try:
                  # Fetch the HTML page containing the CSV file
                  response = requests.get(CSV_PAGE_URL)
                  response.raise_for_status()  # Raise an exception if the request fails

                  # Parse the HTML content using Beautiful Soup
                  soup = BeautifulSoup(response.text, 'html.parser')

                  # Extract the CSV content (assumes the CSV is directly in the response text)
                  csv_text = soup.get_text()

                  # Parse the CSV content
                  reader = csv.reader(csv_text.splitlines())
                  headers = next(reader)
                  player_name_index = headers.index("player_name")
                  player_id_index = headers.index("player_id")

                  # Convert the CSV rows into a JSON structure
                  players = []
                  for row in reader:
                      if len(row) > max(player_name_index, player_id_index):
                          player_name = row[player_name_index].strip().replace('"', '')
                          player_id = row[player_id_index].strip().replace('"', '')
                          players.append({"name": player_name, "id": player_id})

                  return players
              except requests.RequestException as e:
                  print(f"Error fetching the CSV page: {e}")
                  return None
              except Exception as e:
                  print(f"Error processing the CSV content: {e}")
                  return None

          def save_to_json(data, file_path):
              try:
                  with open(file_path, "w") as json_file:
                      json.dump(data, json_file, indent=4)
                  print(f"Data successfully saved to {file_path}")
              except Exception as e:
                  print(f"Error saving data to JSON: {e}")

          players = fetch_and_process_csv()
          if players:
              save_to_json(players, OUTPUT_JSON_FILE)
          else:
              print("No players data fetched.")
          EOF
